<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>PA#3 – AR Conjugation Surface (MN marker)</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      #hint {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 1;
        color: #cdd6f4;
        font-size: 0.8rem;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }

      #hint strong {
        color: #cba6f7;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/three.js/build/ar.js"></script>
    <script>
      THREEx.ArToolkitContext.baseURL =
        "https://jeromeetienne.github.io/AR.js/three.js/";
    </script>
  </head>

  <body>
    <div id="hint">
      Наведіть камеру на маркер <strong>MN</strong> &nbsp;|&nbsp; поверхня
      кон’югації
    </div>

    <script src="./Model.js"></script>
    <script>
      var renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setClearColor(new THREE.Color("lightgrey"), 0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.position = "absolute";
      renderer.domElement.style.top = "0px";
      renderer.domElement.style.left = "0px";
      document.body.appendChild(renderer.domElement);

      var onRenderFcts = [];
      var scene = new THREE.Scene();
      var camera = new THREE.Camera();
      scene.add(camera);

      var arToolkitSource = new THREEx.ArToolkitSource({
        sourceType: "webcam",
      });

      var arToolkitContext = new THREEx.ArToolkitContext({
        cameraParametersUrl:
          THREEx.ArToolkitContext.baseURL + "../data/data/camera_para.dat",
        detectionMode: "mono",
        maxDetectionRate: 30,
        canvasWidth: 80 * 3,
        canvasHeight: 60 * 3,
      });

      arToolkitContext.init(function onCompleted() {
        camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        onResize();
      });

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById("hint").innerHTML =
          "WebRTC недоступний у цьому браузері.<br>" +
          "Відкрийте через <strong>https://</strong> або <strong>localhost</strong> (не file://).";
      } else {
        arToolkitSource.init(
          function onReady() {
            var video = arToolkitSource.domElement;
            if (!video) return;
            if (video.readyState >= 1) {
              onResize();
            } else {
              video.addEventListener("loadedmetadata", onResize, {
                once: true,
              });
            }
          },
          function onError(err) {
            var hint = document.getElementById("hint");
            hint.innerHTML =
              "Камера недоступна: " +
              (err.message || err.name || "невідома помилка") +
              "<br>Відкрийте сторінку через <strong>https://</strong> або <strong>localhost</strong>.";
          },
        );
      }

      window.addEventListener("resize", onResize);

      function onResize() {
        if (!arToolkitSource.domElement) return;

        arToolkitSource.onResizeElement();
        arToolkitSource.copyElementSizeTo(renderer.domElement);

        var ctrl = arToolkitContext.arController;
        if (ctrl && ctrl.canvas) {
          arToolkitSource.copyElementSizeTo(ctrl.canvas);
        }
      }

      onRenderFcts.push(function () {
        if (arToolkitSource.ready === false) return;
        arToolkitContext.update(arToolkitSource.domElement);
      });

      var markerRoot = new THREE.Group();
      scene.add(markerRoot);

      new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
        type: "pattern",
        patternUrl: "./marker/pattern-MN.patt",
      });

      var smoothedRoot = new THREE.Group();
      scene.add(smoothedRoot);

      var smoothedControls = new THREEx.ArSmoothedControls(smoothedRoot, {
        lerpPosition: 0.4,
        lerpQuaternion: 0.3,
        lerpScale: 1,
      });

      onRenderFcts.push(function () {
        smoothedControls.update(markerRoot);
      });

      function buildConjugationMesh() {
        var data = {};
        CreateSurfaceData(data, {
          R1: 0.5,
          R2: 1.5,
          c: 6.0,
          phiDeg: 30,
          numU: 48,
          numV: 96,
        });

        var geo = new THREE.BufferGeometry();
        geo.addAttribute(
          "position",
          new THREE.BufferAttribute(data.verticesF32, 3),
        );
        geo.addAttribute("uv", new THREE.BufferAttribute(data.texcoordsF32, 2));
        geo.setIndex(new THREE.BufferAttribute(data.indicesU16, 1));
        geo.computeVertexNormals();

        var group = new THREE.Group();

        var solidMat = new THREE.MeshPhongMaterial({
          color: 0x3a86ff,
          specular: 0x224488,
          shininess: 60,
          side: THREE.DoubleSide,
        });
        var solid = new THREE.Mesh(geo, solidMat);
        solid.scale.set(0.25, 0.25, 0.25);
        group.add(solid);

        var wireMat = new THREE.MeshBasicMaterial({
          color: 0xa0c4ff,
          wireframe: true,
          opacity: 0.2,
          transparent: true,
        });
        var wire = new THREE.Mesh(geo, wireMat);
        wire.scale.set(0.25, 0.25, 0.25);
        group.add(wire);

        return group;
      }

      var arWorldRoot = smoothedRoot;
      arWorldRoot.add(buildConjugationMesh());

      // Освітлення
      scene.add(new THREE.AmbientLight(0xffffff, 0.45));
      var dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      onRenderFcts.push(function () {
        renderer.render(scene, camera);
      });

      var lastTimeMsec = null;
      requestAnimationFrame(function animate(nowMsec) {
        requestAnimationFrame(animate);
        lastTimeMsec = lastTimeMsec || nowMsec - 1000 / 60;
        var deltaMsec = Math.min(200, nowMsec - lastTimeMsec);
        lastTimeMsec = nowMsec;
        onRenderFcts.forEach(function (onRenderFct) {
          onRenderFct(deltaMsec / 1000, nowMsec / 1000);
        });
      });
    </script>
  </body>
</html>
