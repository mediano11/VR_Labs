<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PA#3 – AR Conjugation Surface (MN marker)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; }

      #overlay {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #cdd6f4;
        font-family: "Segoe UI", sans-serif;
        font-size: 0.82rem;
        padding: 7px 16px;
        border-radius: 20px;
        pointer-events: none;
        white-space: nowrap;
        z-index: 999;
      }

      #overlay span { color: #cba6f7; font-weight: bold; }
    </style>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body>
    <div id="overlay">
      Point camera at <span>MN</span> marker &nbsp;|&nbsp;
      Surface of Conjugation of two coaxial cylinder and cone
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix;
            matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true;"
      vr-mode-ui="enabled: false"
    >

      <!-- Lighting -->
      <a-light type="ambient"     color="#ffffff" intensity="0.45"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.9"
               position="1 2 1"></a-light>
      <a-light type="directional" color="#8899ff" intensity="0.4"
               position="-1 -1 -1"></a-light>

      <!-- Custom marker: our MN pattern -->
      <a-marker type="pattern" url="./marker/pattern-MN.patt">
        <!--
          conjugation-surface component builds the Three.js BufferGeometry
          using the exact same parametric formula as Model.js.
          scale="0.07 0.07 0.07" maps the surface (~R2=1.5 units) to
          ≈ 0.1 A-Frame units so it sits neatly over the printed marker.
        -->
        <a-entity
          conjugation-surface
          scale="0.07 0.07 0.07"
        ></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      /* ------------------------------------------------------------------ */
      /*  Helpers (same as Model.js)                                         */
      /* ------------------------------------------------------------------ */
      function deg2rad(a) { return a * Math.PI / 180; }

      /**
       * Builds a Three.js BufferGeometry for the Surface of Conjugation
       * of two coaxial cylinders and cone.
       * Formula mirrors CreateSurfaceData() in Model.js exactly.
       */
      function buildConjugationGeometry(params) {
        params = params || {};

        const R1     = params.R1     !== undefined ? params.R1     : 0.5;
        const R2     = params.R2     !== undefined ? params.R2     : 1.5;
        const c      = params.c      !== undefined ? params.c      : 6.0;
        const phiDeg = params.phiDeg !== undefined ? params.phiDeg : 30;
        const numU   = Math.max(2, Math.floor(params.numU !== undefined ? params.numU : 48));
        const numV   = Math.max(3, Math.floor(params.numV !== undefined ? params.numV : 96));

        const phi = deg2rad(phiDeg);

        let a = R2 - R1;
        if (Math.abs(a) < 1e-9) a = 1e-5;

        // Choose b (the z-range of the blending region)
        let b;
        if      (phi < 0 && a < 0) b = c / 4;
        else if (phi > 0 && a > 0) b = c / 4;
        else if (phi < 0 && a > 0) b = (3 * c) / 4;
        else                       b = (3 * c) / 4;   // phi > 0 && a < 0

        // r(z) — parametric radius
        const r = z => a * (1 - Math.cos((2 * Math.PI * z) / c)) + R1;

        /* -- vertices & UVs -------------------------------------------- */
        const positions = [];
        const uvs       = [];

        for (let i = 0; i < numU; i++) {
          const z      = (b * i) / (numU - 1);
          const radius = r(z);

          for (let j = 0; j < numV; j++) {
            const theta = (2 * Math.PI * j) / numV;
            positions.push(
              radius * Math.cos(theta),
              radius * Math.sin(theta),
              z
            );
            uvs.push(
              numU > 1 ? i / (numU - 1) : 0,
              j / numV
            );
          }
        }

        /* -- indices (two triangles per quad, wrapping in V) ------------ */
        const indices = [];
        for (let i = 0; i < numU - 1; i++) {
          for (let j = 0; j < numV; j++) {
            const jn = (j + 1) % numV;
            const i0 = i       * numV + j;
            const i1 = i       * numV + jn;
            const i2 = (i + 1) * numV + j;
            const i3 = (i + 1) * numV + jn;
            indices.push(i0, i2, i1,
                         i1, i2, i3);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs,       2));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      /* ------------------------------------------------------------------ */
      /*  A-Frame component                                                  */
      /* ------------------------------------------------------------------ */
      AFRAME.registerComponent('conjugation-surface', {
        schema: {
          R1:     { type: 'number',  default: 0.5  },
          R2:     { type: 'number',  default: 1.5  },
          c:      { type: 'number',  default: 6.0  },
          phiDeg: { type: 'number',  default: 30   },
          numU:   { type: 'int',     default: 48   },
          numV:   { type: 'int',     default: 96   },
          color:       { type: 'color', default: '#3a86ff' },
          wireColor:   { type: 'color', default: '#a0c4ff' },
          wireOpacity: { type: 'number', default: 0.20 }
        },

        init: function () {
          const d   = this.data;
          const geo = buildConjugationGeometry({
            R1: d.R1, R2: d.R2, c: d.c, phiDeg: d.phiDeg,
            numU: d.numU, numV: d.numV
          });

          /* Solid mesh (Phong shading) */
          const solidMat = new THREE.MeshPhongMaterial({
            color:     new THREE.Color(d.color),
            specular:  new THREE.Color(0x224488),
            shininess: 60,
            side:      THREE.DoubleSide
          });
          const solidMesh = new THREE.Mesh(geo, solidMat);

          /*
           * The surface's parametric axis is Z.
           * In A-Frame / Three.js the marker plane is XZ, Y is up.
           * Rotate -90° around X so the surface "grows" upward from the marker.
           */
          solidMesh.rotation.x = -Math.PI / 2;

          /* Wireframe overlay */
          const wireMat = new THREE.MeshBasicMaterial({
            color:       new THREE.Color(d.wireColor),
            wireframe:   true,
            opacity:     d.wireOpacity,
            transparent: true
          });
          const wireMesh = new THREE.Mesh(geo, wireMat);
          wireMesh.rotation.x = -Math.PI / 2;

          this.el.setObject3D('mesh',      solidMesh);
          this.el.setObject3D('wireframe', wireMesh);
        },

        remove: function () {
          this.el.removeObject3D('mesh');
          this.el.removeObject3D('wireframe');
        }
      });
    </script>
  </body>
</html>
